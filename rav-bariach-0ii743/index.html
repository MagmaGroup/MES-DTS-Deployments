<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rav-Bariach — DTS Deployments</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f2f4fa;
      --card-bg:      #ffffff;
      --card-border:  #e3e7f1;
      --text:         #171d33;
      --text-muted:   #667089;
      --text-dim:     #9aa3ba;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Heebo', Arial, sans-serif;
      background-color: var(--bg);
      background-image: linear-gradient(180deg,
        #070b16 0%, #0c1224 8%, #141c34 16%, #212c4c 26%,
        #38456f 37%, #6478a0 48%, #9fb0d2 58%, #cddaf0 68%,
        #e9eefb 80%, var(--bg) 92%);
      background-repeat: no-repeat;
      background-size: 100% 820px;
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header — sits on the dark part of the body's space-to-daylight
       gradient, no background of its own so the transition is continuous ── */
    .page-header { padding: 48px 44px 44px; position: relative; overflow: visible; }
    .star-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 520px; pointer-events: none; z-index: 0; }
    .header-inner { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .header-left { flex: 1; }
    .header-back { font-size: 12px; color: rgba(255,255,255,0.4); text-decoration: none; display: inline-block; margin-bottom: 16px; letter-spacing: 0.3px; transition: color 0.15s; }
    .header-back:hover { color: rgba(255,255,255,0.75); }
    .header-pill { display: inline-block; background: #2dd4bf; color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; padding: 5px 15px; border-radius: 20px; margin-bottom: 14px; }
    .header-title { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1; color: #fff; }
    .header-sub { font-size: 14px; color: rgba(255,255,255,0.55); margin-top: 8px; }
    .header-rocket { font-size: 4.2rem; line-height: 1; flex-shrink: 0; filter: drop-shadow(0 0 20px rgba(255,200,50,0.3)); }

    main { max-width: 1200px; margin: 36px auto; padding: 0 28px 60px; }

    /* ── Toolbar ── */
    .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .toolbar-stats { font-size: 13px; color: var(--text-muted); font-weight: 600; }
    .toolbar-stats strong { color: var(--text); font-weight: 800; }
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-pill { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 12.5px; font-weight: 700; padding: 7px 15px; border-radius: 20px; border: 1px solid var(--card-border); background: #fff; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
    .filter-pill:hover { border-color: #c8d5e8; }
    .filter-pill.active { background: #171d33; border-color: #171d33; color: #fff; }
    .filter-count { opacity: 0.65; margin-left: 2px; }

    /* ── Deploy list — wide, thin cards; all details laid out side by side ── */
    .deploy-list { display: flex; flex-direction: column; gap: 14px; }
    .deploy-card {
      display: flex; align-items: center; flex-wrap: wrap; gap: 26px;
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-left: 6px solid var(--accent, #2dd4bf);
      border-radius: 14px; padding: 20px 26px;
      box-shadow: 0 1px 3px rgba(15,23,42,0.05), 0 6px 20px rgba(15,23,42,0.04);
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
    }
    .deploy-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 1px 0 1px color-mix(in srgb, var(--accent) 20%, transparent), 0 16px 36px color-mix(in srgb, var(--accent) 14%, transparent);
    }
    .deploy-card-head { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
    .deploy-id { font-size: 19px; font-weight: 800; letter-spacing: -0.2px; color: var(--text); white-space: nowrap; }
    .deploy-title { font-size: 13.5px; color: var(--text-muted); font-weight: 500; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .deploy-meta { display: flex; gap: 24px; flex-wrap: wrap; }
    .deploy-meta > div { display: flex; flex-direction: column; gap: 3px; min-width: 62px; }
    .meta-col-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); }
    .meta-col-value { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; }
    .meta-col-value.na { color: var(--text-dim); font-weight: 400; }
    .deploy-footer { margin-left: auto; }
    .view-link { font-size: 13px; font-weight: 700; color: #fff; background: var(--accent, #2dd4bf); text-decoration: none; padding: 9px 18px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px; transition: opacity 0.15s, transform 0.15s; white-space: nowrap; }
    .view-link:hover { opacity: 0.88; transform: translateY(-1px); text-decoration: none; }

    /* ── Badges ── */
    .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; padding: 3px 11px; border-radius: 20px; letter-spacing: 0.3px; white-space: nowrap; }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; background: currentColor; }
    .badge-open      { background: #dcfce7; color: #15803d; }
    .badge-scheduled { background: #fef9c3; color: #92400e; }
    .badge-closed    { background: #f1f5f9; color: #64748b; }

    .empty-block { text-align: center; color: var(--text-dim); font-size: 14px; padding: 64px 24px; background: var(--card-bg); border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

    @media (max-width: 640px) { .deploy-footer { margin-left: 0; } }
  </style>
</head>
<body>
  <div class="page-header">
    <canvas class="star-canvas"></canvas>
    <div class="header-inner">
      <div class="header-left">
        <div class="header-pill">Rav-Bariach</div>
        <div class="header-title">DTS Deployment History</div>
        <div class="header-sub">Magma MES releases for Rav-Bariach</div>
      </div>
      <div class="header-rocket">🚀</div>
    </div>
  </div>
  <main>
    <div class="toolbar">
      <div class="toolbar-stats" id="toolbar-stats"></div>
      <div class="filter-bar" id="filter-bar"></div>
    </div>
    <div class="deploy-list" id="dts-list" style="--accent:#2dd4bf"></div>
  </main>
  <script>(function(){var c=document.querySelector('.star-canvas');if(!c)return;var ctx=c.getContext('2d');function d(){c.width=c.offsetWidth;c.height=c.offsetHeight;for(var i=0;i<160;i++){var y=Math.pow(Math.random(),1.6)*c.height;var fade=1-(y/c.height)*0.85;ctx.beginPath();ctx.arc(Math.random()*c.width,y,Math.random()*1.2+.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+(fade*(Math.random()*.5+.15)).toFixed(2)+')';ctx.fill();}}d();window.addEventListener('resize',d);})();</script>
  <script src="../assets/dts-history.js"></script>
</body>
</html>
